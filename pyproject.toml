[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "birthdaybot"
version = "0.1.0"
description = "A timezone-aware Discord birthday bot backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "discord.py>=2.7.1,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.15", "pyyaml>=6"]

[project.scripts]
birthdaybot = "birthdaybot.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birthdaybot"]

[tool.hatch.build.targets.wheel.force-include]
"static/locales" = "birthdaybot/locales"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]